# =======================================================================
# AeroSpace Configuration (Pure Floating Workspaces Mode)
# No Automatic Tiling - Preserves native macOS floating window experience
# Managed by Darwin Home Manager (nixos-config)
# =======================================================================

# Configuration Format Version (Version 2 is recommended by AeroSpace)
config-version = 2

start-at-login = true

# =======================================================================
# 多显示器绑定规则 (Multi-Monitor Force Assignment)
# =======================================================================
[workspace-to-monitor-force-assignment]
# 内置主屏幕专属工作区池 (1-1 ~ 1-9)
1-1 = 'main'
1-2 = 'main'
1-3 = 'main'
1-4 = 'main'
1-5 = 'main'
1-6 = 'main'
1-7 = 'main'
1-8 = 'main'
1-9 = 'main'

# 外接副屏幕专属工作区池 (2-1 ~ 2-9)
# 当外接屏存在时严格绑定在副屏，拔掉外接屏时自动无缝回退到主屏 (Fallback)
2-1 = ['secondary', 'main']
2-2 = ['secondary', 'main']
2-3 = ['secondary', 'main']
2-4 = ['secondary', 'main']
2-5 = ['secondary', 'main']
2-6 = ['secondary', 'main']
2-7 = ['secondary', 'main']
2-8 = ['secondary', 'main']
2-9 = ['secondary', 'main']

# 兼容基础工作区
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']

# -----------------------------------------------------------------------
# 快捷键映射 (Key Mappings - Context-Aware Workspaces)
# -----------------------------------------------------------------------
[mode.main.binding]

# --- 1. 跨工作区切换与发送 (根据当前聚焦显示器自适应 1~9) ---
cmd-1 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 1'
cmd-2 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 2'
cmd-3 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 3'
cmd-4 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 4'
cmd-5 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 5'
cmd-6 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 6'
cmd-7 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 7'
cmd-8 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 8'
cmd-9 = 'exec-and-forget bash ~/.config/aerospace/scripts/switch-workspace.sh 9'

# Cmd + Shift + 1~9: 将当前窗口发送到当前屏幕的工作区 (并跟随切换焦点)
cmd-shift-1 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 1 follow'
cmd-shift-2 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 2 follow'
cmd-shift-3 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 3 follow'
cmd-shift-4 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 4 follow'
cmd-shift-5 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 5 follow'
cmd-shift-6 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 6 follow'
cmd-shift-7 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 7 follow'
cmd-shift-8 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 8 follow'
cmd-shift-9 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 9 follow'

# Cmd + Ctrl + 1~9: 静默将当前窗口发送到当前屏幕的工作区 (留在原地)
cmd-ctrl-1 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 1 silent'
cmd-ctrl-2 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 2 silent'
cmd-ctrl-3 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 3 silent'
cmd-ctrl-4 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 4 silent'
cmd-ctrl-5 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 5 silent'
cmd-ctrl-6 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 6 silent'
cmd-ctrl-7 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 7 silent'
cmd-ctrl-8 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 8 silent'
cmd-ctrl-9 = 'exec-and-forget bash ~/.config/aerospace/scripts/move-workspace.sh 9 silent'

# --- 2. 跨显示器焦点与窗口甩送 ---
alt-left  = 'focus-monitor prev'
alt-right = 'focus-monitor next'
alt-shift-left  = 'move-node-to-monitor prev --focus-follows-window'
alt-shift-right = 'move-node-to-monitor next --focus-follows-window'

# --- 3. 窗口状态与焦点闪切 ---
# Option(Alt) + Tab / Option(Alt) + Shift + Tab:
# 在“当前窗口”与“上一个激活的窗口”之间瞬间来回闪切 (Back-and-Forth)
alt-tab = 'focus-back-and-forth'
alt-shift-tab = 'focus-back-and-forth'

# Option(Alt) + ` (反引号): 在“最近使用的工作区”与“当前工作区”之间来回闪切 (Workspace Back-and-Forth)
alt-backtick = 'workspace-back-and-forth'

# --- 4. 配置管理 ---
# Cmd + Shift + R: 重新加载配置
cmd-shift-r = 'reload-config'

# -----------------------------------------------------------------------
# 应用自动分流规则 (App Routing)
# -----------------------------------------------------------------------

# --- 主屏 工作区 1-2：终端工具 ---
# Kitty 终端
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = ['move-node-to-workspace 1-2', 'layout floating']

# Alacritty 终端
[[on-window-detected]]
if.app-id = 'org.alacritty'
run = ['move-node-to-workspace 1-2', 'layout floating']

# Seedmux 终端/会话工具
[[on-window-detected]]
if.app-id = 'com.xx.seedmux'
run = ['move-node-to-workspace 1-2', 'layout floating']

# --- 主屏 工作区 1-3：虚拟机 ---
# UTM 虚拟机
[[on-window-detected]]
if.app-id = 'com.utmapp.UTM'
run = ['move-node-to-workspace 1-3', 'layout floating']

# --- 副屏 工作区 2-1：社交通讯与聊天软件 ---
# Telegram
[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace 2-1', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.tdesktop.Telegram'
run = ['move-node-to-workspace 2-1', 'layout floating']

# WeChat 微信
[[on-window-detected]]
if.app-id = 'com.tencent.xinWeChat'
run = ['move-node-to-workspace 2-1', 'layout floating']

# QQ
[[on-window-detected]]
if.app-id = 'com.tencent.qq'
run = ['move-node-to-workspace 2-1', 'layout floating']

# Discord
[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 2-1', 'layout floating']

# -----------------------------------------------------------------------
# 全局纯浮动规则：匹配其他所有窗口，默认全部浮动
# -----------------------------------------------------------------------
[[on-window-detected]]
if.app-name-regex-substring = '.*'
run = 'layout floating'
